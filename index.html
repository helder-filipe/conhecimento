<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zettelkasten Hub</title>

  <!-- FAVICON (Miniatura da Janela/Separador) -->
  <link rel="icon" type="image/png" href="logo_simplificado.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Vis Network (Para o Mapa de Nós) -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    #graph-container {
      width: 100%;
      height: 480px;
      background-color: #0f172a; /* Slate 900 */
      border: 1px solid #334155; /* Slate 700 */
      border-radius: 0.75rem;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Navegação / Cabeçalho -->
  <header class="border-b border-slate-800 bg-slate-950/50 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
      <!-- LOGO E SUBTÍTULO POR BAIXO -->
      <div class="flex flex-col items-start gap-1">
        <img src="Zettelkasten hub logo2.png" alt="Zettelkasten Hub Logo" class="h-[107px] object-contain rounded-lg shadow-md border border-slate-700/50">
        <p class="text-xs text-slate-400 font-medium">Centro de Aprendizagem & Rede de Conhecimento</p>
      </div>

      <button type="button" onclick="carregarZettelkasten()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg transition-colors flex items-center gap-1 font-medium">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Atualizar Dados
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- Secção do Grafo (Vis Network) -->
    <section>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-3 gap-2">
        <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
          <span>🕸️</span> Mapa de Conexões (Graph View)
        </h2>
        <span id="graph-status" class="text-xs text-slate-400">A carregar rede...</span>
      </div>

      <!-- Legenda de Cores por Categoria -->
      <div id="categorias-legenda" class="flex flex-wrap gap-2 mb-3 text-xs text-slate-300">
        <!-- Preenchido via JavaScript -->
      </div>

      <div id="graph-container" class="shadow-2xl relative">
        <div id="graph-loader" class="absolute inset-0 flex items-center justify-center bg-slate-900/80 rounded-xl z-10">
          <span class="text-sm text-indigo-400 font-medium">A sincronizar com Google Sheets...</span>
        </div>
      </div>
    </section>

    <!-- Formulário para Criar/Editar Nota -->
    <section id="form-container" class="bg-slate-800/80 p-6 rounded-xl border border-slate-700/80 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 id="form-titulo-header" class="text-lg font-bold text-indigo-400 flex items-center gap-2">
          <span>➕</span> Criar Nova Nota Zettelkasten
        </h2>
        <button type="button" onclick="limparFormulario()" class="text-xs text-slate-400 hover:text-slate-200 underline">
          Limpar / Nova Nota
        </button>
      </div>
      
      <form id="form-nova-nota" onsubmit="guardarNota(event)" class="space-y-4">
        <input type="hidden" id="form-id" value="">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Título da Nota</label>
            <input type="text" id="novo-titulo" required placeholder="Ex: Algoritmo de Busca em Grafos" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Plataforma / Origem</label>
            <select id="nova-plataforma" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
              <option value="Nota">Nota Pessoal</option>
              <option value="YouTube">YouTube</option>
              <option value="Instagram">Instagram</option>
              <option value="X">X (Twitter)</option>
              <option value="Artigo">Artigo / Web</option>
            </select>
          </div>
        </div>

        <!-- Categoria e Subcategoria -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Categoria (Coluna I)</label>
            <input type="text" id="nova-categoria" placeholder="Ex: Marketing, Programação, Padel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Subcategoria (Coluna J)</label>
            <input type="text" id="nova-subcategoria" placeholder="Ex: SEO, JavaScript, Tática" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Conteúdo / Ideia Atómica</label>
          <textarea id="novo-conteudo" rows="3" required placeholder="Escreve o resumo atómico ou reflexão principal..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">URLs dos Recursos (separados por vírgula)</label>
            <input type="text" id="novo-url" placeholder="https://youtube.com/..., https://artigo.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Tags (separadas por vírgulas)</label>
            <input type="text" id="novas-tags" placeholder="javascript, redes, zettelkasten" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Ligar a IDs (separados por vírgula)</label>
            <input type="text" id="novos-links" placeholder="Ex: 202607241010, 202607241012" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <button type="submit" id="btn-submeter" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors flex items-center gap-2">
          <span>💾</span> Guardar Nota no Zettelkasten
        </button>
      </form>
    </section>

    <!-- Secção de Filtros / Pesquisa -->
    <section class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-800">
      <div class="w-full sm:w-96">
        <input type="text" id="input-busca" oninput="filtrarNotas()" placeholder="Pesquisar por título, categoria, conteúdo ou tag..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
      </div>
      <div class="text-xs text-slate-400">
        Total de notas: <span id="total-notas" class="font-bold text-indigo-400">0</span>
      </div>
    </section>

    <!-- Grelha de Cartões (Notas Zettelkasten) -->
    <section>
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <span>📝</span> Notas Atómicas
      </h2>
      <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- MODAL PARA VISUALIZAR DETALHES DA NOTA -->
    <div id="modal-nota" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="if(event.target === this) fecharModal()">
      <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <button type="button" onclick="fecharModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700 p-2 rounded-lg transition-colors">
          ✕
        </button>
        <div id="modal-conteudo-corpo"></div>
      </div>
    </div>

  </main>

  <!-- Lógica JavaScript -->
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbx7FIf0ElU39cn7oFpSkim0m9u8ofNkjJNneBKnz2qQzYgJ6RxFFyNWu8LdrbtjtczZJg/exec';

    let todasAsNotas = [];
    let mapaNotas = new Map();
    let networkInstance = null;

    // PALETA DE CORES PARA CATEGORIAS
    const PALETA_CORES = [
      { bg: '#6366f1', border: '#818cf8' }, // Índigo
      { bg: '#10b981', border: '#34d399' }, // Esmeralda / Verde
      { bg: '#f59e0b', border: '#fbbf24' }, // Âmbar / Laranja
      { bg: '#ec4899', border: '#f472b6' }, // Rosa
      { bg: '#06b6d4', border: '#22d3ee' }, // Ciano
      { bg: '#8b5cf6', border: '#a78bfa' }, // Roxo
      { bg: '#ef4444', border: '#f87171' }  // Vermelho
    ];

    const mapaCoresCategorias = new Map();

    function obterValorPropriedade(objeto, chaveProcurada) {
      if (!objeto) return '';
      const chaveEncontrada = Object.keys(objeto).find(k => k.toLowerCase().replace(/\s+/g, '').includes(chaveProcurada.toLowerCase().replace(/\s+/g, '')));
      return chaveEncontrada && objeto[chaveEncontrada] !== undefined ? String(objeto[chaveEncontrada]).trim() : '';
    }

    // 1. Função de obter cor garantindo que maiúsculas/minúsculas não criam cores diferentes
    function obterCorCategoria(categoria) {
      const catTexto = categoria ? String(categoria).trim() : 'Geral';
      const catChave = catTexto.toLowerCase(); // Chave única em minúsculas
      
      if (!mapaCoresCategorias.has(catChave)) {
        const indice = mapaCoresCategorias.size % PALETA_CORES.length;
        mapaCoresCategorias.set(catChave, {
          nomeExibicao: catTexto, // Guarda o nome original para a legenda
          cores: PALETA_CORES[indice]
        });
      }
      return mapaCoresCategorias.get(catChave);
    }

    document.addEventListener('DOMContentLoaded', () => {
      carregarZettelkasten();
    });

    // 1. CARREGAR DADOS DO GOOGLE SHEETS
    async function carregarZettelkasten() {
      const loader = document.getElementById('graph-loader');
      const statusText = document.getElementById('graph-status');
      
      if (loader) loader.classList.remove('hidden');
      if (statusText) statusText.textContent = 'A carregar...';

      try {
        const resposta = await fetch(API_URL);
        todasAsNotas = await resposta.json();

        mapaNotas.clear();
        todasAsNotas.forEach(nota => {
          const id = obterValorPropriedade(nota, 'id');
          if (id) mapaNotas.set(id, nota);
        });

        document.getElementById('total-notas').textContent = todasAsNotas.length;
        renderizarGrafo(todasAsNotas);
        renderizarCartoes(todasAsNotas);

        if (statusText) statusText.textContent = `${todasAsNotas.length} notas carregadas`;
      } catch (erro) {
        console.error('Erro ao obter dados:', erro);
        if (statusText) statusText.textContent = 'Erro de ligação';
      } finally {
        if (loader) loader.classList.add('hidden');
      }
    }

    // 2. RENDERIZAR GRAFO COM LIGAÇÕES E CORES POR CATEGORIA
    function renderizarGrafo(notas) {
      const nodesArray = [];
      const edgesArray = [];
      
      // Limpar mapa de cores para reaplicar com base nas notas atuais
      mapaCoresCategorias.clear();

      const idsExistentes = new Set();
      notas.forEach(n => {
        const idValor = obterValorPropriedade(n, 'id');
        if (idValor) idsExistentes.add(String(idValor).trim());
      });

      notas.forEach(nota => {
        const idStr = String(obterValorPropriedade(nota, 'id')).trim();
        const linksStr = obterValorPropriedade(nota, 'linkspara');
        const tituloStr = obterValorPropriedade(nota, 'titulo') || `Nota ${idStr}`;
        const catStr = obterValorPropriedade(nota, 'categoria') || 'Geral';

        if (!idStr) return;

        // Obtém o objeto de cor unificado para esta categoria
        const infoCategoria = obterCorCategoria(catStr);

        nodesArray.push({
          id: idStr,
          label: tituloStr,
          shape: 'dot',
          size: 18,
          color: {
            background: infoCategoria.cores.bg,
            border: infoCategoria.cores.border,
            highlight: { background: '#a855f7', border: '#c084fc' }
          },
          font: { color: '#f1f5f9', size: 12 }
        });

        if (linksStr) {
          const links = linksStr.split(/[,;]+/);
          links.forEach(destino => {
            const destinoLimpo = String(destino).trim();
            if (destinoLimpo && idsExistentes.has(destinoLimpo) && destinoLimpo !== idStr) {
              edgesArray.push({
                from: idStr,
                to: destinoLimpo,
                color: { color: '#818cf8', highlight: '#c084fc', inherit: false },
                width: 2,
                arrows: { to: { enabled: true, scaleFactor: 0.8 } }
              });
            }
          });
        }
      });

      // Renderizar Legenda perfeitamente alinhada com os nós
      const legendaDiv = document.getElementById('categorias-legenda');
      if (legendaDiv) {
        legendaDiv.innerHTML = Array.from(mapaCoresCategorias.values()).map(item => {
          return `
            <span class="inline-flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${item.cores.bg}"></span>
              <span class="font-medium">${item.nomeExibicao}</span>
            </span>
          `;
        }).join('');
      }

      const container = document.getElementById('graph-container');
      const data = {
        nodes: new vis.DataSet(nodesArray),
        edges: new vis.DataSet(edgesArray)
      };

      const options = {
        nodes: { borderWidth: 2 },
        edges: { smooth: { type: 'continuous' } },
        physics: {
          enabled: true,
          barnesHut: { gravitationalConstant: -3000, centralGravity: 0.3, springLength: 100, springConstant: 0.04 }
        },
        interaction: { hover: true, selectConnectedEdges: false }
      };

      if (networkInstance) networkInstance.destroy();

      networkInstance = new vis.Network(container, data, options);

      networkInstance.on("selectNode", function (params) {
        if (params.nodes && params.nodes.length > 0) {
          abrirModalNota(String(params.nodes[0]).trim());
        }
      });
    }

    // 3. PREVISUALIZAÇÃO DE MEDIA
    function gerarPreviewMedia(urlsStr, plataforma) {
      if (!urlsStr) return '';
      
      // Separa por vírgula ou quebra de linha e limpa os espaços
      const urls = urlsStr.split(/[,;\n]+/).map(u => u.trim()).filter(Boolean);
      if (urls.length === 0) return '';

      const previewsHTML = urls.map(url => {
        let urlValida = url;
        if (!urlValida.startsWith('http://') && !urlValida.startsWith('https://')) {
          urlValida = 'https://' + urlValida;
        }

        const matchYT = urlValida.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);

        if (matchYT && matchYT[2].length === 11) {
          const videoId = matchYT[2];
          return `
            <div class="rounded-lg overflow-hidden border border-slate-700/80 bg-slate-950 shadow-inner">
              <div class="aspect-video w-full relative">
                <iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1" title="YouTube" frameborder="0" allowfullscreen></iframe>
              </div>
            </div>
          `;
        }

        const imagemApiUrl = `https://api.microlink.io/?url=${encodeURIComponent(urlValida)}&embed=image.url`;
        return `
          <div class="rounded-lg overflow-hidden border border-slate-700/80 bg-slate-900/60 group">
            <a href="${urlValida}" target="_blank" rel="noopener noreferrer" class="block">
              <div class="aspect-video w-full bg-slate-950 flex items-center justify-center overflow-hidden">
                <img src="${imagemApiUrl}" alt="Preview" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-3 text-xs text-slate-500\'>🔗 ${urlValida}</div>';" />
              </div>
            </a>
          </div>
        `;
      }).join('');

      // Se for apenas 1 preview, mostra em largura total; se forem 2 ou mais, cria uma grelha de 2 colunas
      const gridClasse = urls.length > 1 ? 'grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3' : 'mt-3 space-y-3';

      return `<div class="${gridClasse}">${previewsHTML}</div>`;
    }

    // 4. PREPARAR FORMULÁRIO PARA EDIÇÃO
    function prepararEdicao(idNota) {
      const nota = todasAsNotas.find(n => obterValorPropriedade(n, 'id') === String(idNota).trim());
      if (!nota) return;

      document.getElementById('form-id').value = obterValorPropriedade(nota, 'id');
      document.getElementById('novo-titulo').value = obterValorPropriedade(nota, 'titulo');
      document.getElementById('novo-conteudo').value = obterValorPropriedade(nota, 'conteudo');
      document.getElementById('nova-plataforma').value = obterValorPropriedade(nota, 'plataforma') || 'Nota';
      document.getElementById('nova-categoria').value = obterValorPropriedade(nota, 'categoria');
      document.getElementById('nova-subcategoria').value = obterValorPropriedade(nota, 'subcategoria');
      document.getElementById('novo-url').value = obterValorPropriedade(nota, 'urlmedia');
      document.getElementById('novas-tags').value = obterValorPropriedade(nota, 'tags');
      document.getElementById('novos-links').value = obterValorPropriedade(nota, 'linkspara');

      document.getElementById('btn-submeter').innerHTML = '<span>✏️</span> Guardar Alterações';
      document.getElementById('form-titulo-header').innerHTML = `<span>✏️</span> Editar Nota (${obterValorPropriedade(nota, 'id')})`;
      document.getElementById('form-container').scrollIntoView({ behavior: 'smooth' });
    }

    // 5. RESETAR FORMULÁRIO
    function limparFormulario() {
      document.getElementById('form-nova-nota').reset();
      document.getElementById('form-id').value = '';
      document.getElementById('btn-submeter').innerHTML = '<span>💾</span> Guardar Nota no Zettelkasten';
      document.getElementById('form-titulo-header').innerHTML = '<span>➕</span> Criar Nova Nota Zettelkasten';
    }

    // 6. RENDERIZAR CARTÕES DE NOTAS (COM CATEGORIAS E SUBCATEGORIAS DESTAÇADAS)
    function renderizarCartoes(notas) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (notas.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-sm col-span-full">Nenhuma nota encontrada.</p>`;
        return;
      }

      notas.forEach(nota => {
        const idStr = obterValorPropriedade(nota, 'id');
        const titulo = obterValorPropriedade(nota, 'titulo') || 'Sem Título';
        const conteudo = obterValorPropriedade(nota, 'conteudo');
        const plataforma = obterValorPropriedade(nota, 'plataforma');
        const categoria = obterValorPropriedade(nota, 'categoria');
        const subcategoria = obterValorPropriedade(nota, 'subcategoria');
        const urlMedia = obterValorPropriedade(nota, 'urlmedia');
        const tagsStr = obterValorPropriedade(nota, 'tags');
        const linksStr = obterValorPropriedade(nota, 'linkspara');

        const tagsArr = tagsStr ? tagsStr.split(',') : [];
        const linksArr = linksStr ? linksStr.split(',') : [];

        const tagsHTML = tagsArr.map(t => t.trim() ? `<span class="bg-indigo-950/80 text-indigo-300 text-[11px] px-2 py-0.5 rounded-full border border-indigo-800/60 font-mono">#${t.trim()}</span>` : '').join(' ');

        const linksHTML = linksArr.map(linkId => {
          const targetId = linkId.trim();
          if (!targetId) return '';
          const notaAlvo = mapaNotas.get(targetId);
          const tituloAlvo = notaAlvo ? obterValorPropriedade(notaAlvo, 'titulo') : `Nota #${targetId}`;
          return `<button type="button" onclick="abrirModalNota('${targetId}')" class="text-xs text-indigo-400 hover:underline flex items-center gap-1">🔗 ${tituloAlvo}</button>`;
        }).filter(Boolean).join('');

        const cartao = document.createElement('div');
        cartao.id = `nota-${idStr}`;
        cartao.className = 'nota-card bg-slate-800/80 border border-slate-700/80 rounded-xl p-5 flex flex-col justify-between shadow-lg hover:border-slate-600 transition-all';

        cartao.innerHTML = `
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-[11px] font-mono text-slate-400 bg-slate-900 px-2 py-0.5 rounded">ID: ${idStr}</span>
              <div class="flex items-center gap-2">
                ${plataforma ? `<span class="text-[11px] font-semibold text-purple-300 bg-purple-950/60 px-2 py-0.5 rounded border border-purple-800/50">${plataforma}</span>` : ''}
                <button type="button" onclick="abrirModalNota('${idStr}')" class="text-xs text-indigo-400 font-medium px-2 py-0.5 rounded bg-indigo-950/60 border border-indigo-800/50">👁️ Ver</button>
                <button type="button" onclick="prepararEdicao('${idStr}')" class="text-xs text-slate-400 font-medium px-2 py-0.5 rounded bg-slate-900 border border-slate-700">✏️ Editar</button>
              </div>
            </div>

            <!-- EXIBIÇÃO DE CATEGORIA E SUBCATEGORIA -->
            ${(categoria || subcategoria) ? `
              <div class="flex items-center gap-1.5 text-xs font-semibold">
                ${categoria ? `<span class="bg-indigo-950/80 text-indigo-300 px-2.5 py-0.5 rounded-md border border-indigo-800/60">${categoria}</span>` : ''}
                ${subcategoria ? `<span class="text-slate-400">/ ${subcategoria}</span>` : ''}
              </div>
            ` : ''}

            <h3 class="text-base font-bold text-white leading-snug">${titulo}</h3>
            <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-line">${conteudo}</p>
            ${tagsHTML ? `<div class="flex flex-wrap gap-1.5 pt-1">${tagsHTML}</div>` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-700/60 space-y-3">
            ${urlMedia ? gerarPreviewMedia(urlMedia, plataforma) : ''}
            ${linksHTML ? `<div class="pt-1 flex flex-col gap-1">${linksHTML}</div>` : ''}
          </div>
        `;

        container.appendChild(cartao);
      });
    }

    // 7. GUARDAR/EDITAR NOTA (POST)
    async function guardarNota(evento) {
      evento.preventDefault();
      
      const btn = document.getElementById('btn-submeter');
      btn.disabled = true;
      btn.innerText = 'A guardar...';

      const idExistente = document.getElementById('form-id').value;
      const agora = new Date();
      const idFinal = idExistente || (
        agora.getFullYear().toString() +
        String(agora.getMonth() + 1).padStart(2, '0') +
        String(agora.getDate()).padStart(2, '0') +
        String(agora.getHours()).padStart(2, '0') +
        String(agora.getMinutes()).padStart(2, '0')
      );

      const novaNota = {
        ID: idFinal,
        Titulo: document.getElementById('novo-titulo').value,
        Plataforma: document.getElementById('nova-plataforma').value,
        Categoria: document.getElementById('nova-categoria').value,
        Subcategoria: document.getElementById('nova-subcategoria').value,
        Conteudo: document.getElementById('novo-conteudo').value,
        UrlMedia: document.getElementById('novo-url').value,
        Tags: document.getElementById('novas-tags').value,
        LinksPara: document.getElementById('novos-links').value,
        DataCriacao: new Date().toISOString().split('T')[0]
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novaNota)
        });

        limparFormulario();
        alert('Nota guardada com sucesso!');
        setTimeout(() => carregarZettelkasten(), 1500);

      } catch (erro) {
        console.error('Erro ao guardar nota:', erro);
        alert('Erro ao guardar a nota.');
      } finally {
        btn.disabled = false;
      }
    }

    // 8. PESQUISA EM TEMPO REAL
    function filtrarNotas() {
      const termo = document.getElementById('input-busca').value.toLowerCase();
      const notasFiltradas = todasAsNotas.filter(nota => {
        const titulo = String(obterValorPropriedade(nota, 'titulo')).toLowerCase();
        const conteudo = String(obterValorPropriedade(nota, 'conteudo')).toLowerCase();
        const tags = String(obterValorPropriedade(nota, 'tags')).toLowerCase();
        const cat = String(obterValorPropriedade(nota, 'categoria')).toLowerCase();
        const subCat = String(obterValorPropriedade(nota, 'subcategoria')).toLowerCase();
        return titulo.includes(termo) || conteudo.includes(termo) || tags.includes(termo) || cat.includes(termo) || subCat.includes(termo);
      });

      renderizarCartoes(notasFiltradas);
    }

    // 9. ABRIR MODAL COM OS DETALHES DA NOTA
    function abrirModalNota(idNota) {
      const idLimpo = String(idNota).trim();
      const nota = todasAsNotas.find(n => obterValorPropriedade(n, 'id') === idLimpo);
      if (!nota) return;

      const modalCorpo = document.getElementById('modal-conteudo-corpo');
      const modalContainer = document.getElementById('modal-nota');

      const id = obterValorPropriedade(nota, 'id');
      const titulo = obterValorPropriedade(nota, 'titulo') || 'Sem Título';
      const conteudo = obterValorPropriedade(nota, 'conteudo');
      const plataforma = obterValorPropriedade(nota, 'plataforma');
      const categoria = obterValorPropriedade(nota, 'categoria');
      const subcategoria = obterValorPropriedade(nota, 'subcategoria');
      const urlMedia = obterValorPropriedade(nota, 'urlmedia');
      const tagsStr = obterValorPropriedade(nota, 'tags');
      const linksStr = obterValorPropriedade(nota, 'linkspara');

      const tagsArr = tagsStr ? tagsStr.split(',') : [];
      const linksArr = linksStr ? linksStr.split(',') : [];

      const tagsHTML = tagsArr.map(t => t.trim() ? `<span class="bg-indigo-950/80 text-indigo-300 text-xs px-2.5 py-1 rounded-full border border-indigo-800/60 font-mono">#${t.trim()}</span>` : '').join(' ');

      const linksHTML = linksArr.map(linkId => {
        const targetId = linkId.trim();
        if (!targetId) return '';
        const notaAlvo = mapaNotas.get(targetId);
        const tituloAlvo = notaAlvo ? obterValorPropriedade(notaAlvo, 'titulo') : `Nota #${targetId}`;
        return `<button type="button" onclick="abrirModalNota('${targetId}')" class="text-xs text-indigo-400 hover:underline bg-slate-950/50 px-2.5 py-1.5 rounded border border-slate-800 flex items-center gap-1">🔗 ${tituloAlvo}</button>`;
      }).filter(Boolean).join('');

      modalCorpo.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <span class="text-xs font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded border border-slate-800">ID: ${id}</span>
            <div class="flex items-center gap-3">
              ${plataforma ? `<span class="text-xs font-semibold text-purple-300 bg-purple-950/60 px-2.5 py-1 rounded border border-purple-800/50">${plataforma}</span>` : ''}
              <button type="button" onclick="fecharModal(); prepararEdicao('${id}')" class="text-xs text-slate-300 hover:text-indigo-400 px-3 py-1 rounded bg-slate-800 border border-slate-700">✏️ Editar Nota</button>
            </div>
          </div>

          ${(categoria || subcategoria) ? `
            <div class="text-xs font-semibold text-indigo-400">
              ${categoria || ''} ${subcategoria ? `<span class="text-slate-500">/ ${subcategoria}</span>` : ''}
            </div>
          ` : ''}

          <h2 class="text-xl font-bold text-white leading-snug">${titulo}</h2>
          <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-line bg-slate-950/40 p-4 rounded-xl border border-slate-800/80">${conteudo}</p>

          ${tagsHTML ? `<div class="flex flex-wrap gap-1.5 pt-1">${tagsHTML}</div>` : ''}
          ${urlMedia ? gerarPreviewMedia(urlMedia, plataforma) : ''}
          ${linksHTML ? `<div class="pt-3 border-t border-slate-800"><span class="text-xs font-bold text-slate-400 block mb-2">NOTAS CONECTADAS:</span><div class="flex flex-wrap gap-2">${linksHTML}</div></div>` : ''}
        </div>
      `;

      modalContainer.classList.remove('hidden');
    }

    // 10. FECHAR MODAL
    function fecharModal() {
      const modalContainer = document.getElementById('modal-nota');
      if (modalContainer) modalContainer.classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fecharModal();
    });
  </script>
</body>
